name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, matching packaging/VERSION (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate tag and release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(python3 packaging/release.py validate "$RELEASE_TAG")
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Confirm permission to publish bundled third-party resources
        env:
          REDISTRIBUTION_CONFIRMED: ${{ vars.RELEASE_REDISTRIBUTION_CONFIRMED }}
        run: |
          if [[ "$REDISTRIBUTION_CONFIRMED" != "true" ]]; then
            echo '::error::Confirm redistribution rights for RoboEXP resources and splash artwork, then set repository variable RELEASE_REDISTRIBUTION_CONFIRMED=true.'
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare robot resources and native compiler for tests
        run: |
          dotnet run --project packaging/BundleAssets -c Release -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP/test-assets"
          echo "ROBOEXP_HOME=$RUNNER_TEMP/test-assets/vendor/app" >> "$GITHUB_ENV"
          dotnet new console --framework net10.0 --output "$RUNNER_TEMP/install-toolchain"
          dotnet add "$RUNNER_TEMP/install-toolchain" reference "$GITHUB_WORKSPACE/src/RoboExp.Core/RoboExp.Core.csproj"
          cat > "$RUNNER_TEMP/install-toolchain/Program.cs" <<'CS'
          using RoboExp.Core.Install;
          var package = ToolchainCatalog.ForCurrentHost()
              ?? throw new PlatformNotSupportedException("No native toolchain for this test runner");
          var bin = await new ToolchainInstaller().InstallAsync(package, args[0], null, CancellationToken.None);
          await File.AppendAllTextAsync(args[1], $"ROBOEXP_ARM_GCC={bin}{Environment.NewLine}");
          CS
          dotnet run --project "$RUNNER_TEMP/install-toolchain" -c Release -- "$RUNNER_TEMP/test-toolchains" "$GITHUB_ENV"
      - name: Test
        run: dotnet test RoboExpCE.slnx -c Release

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: ubuntu-24.04
          - rid: win-arm64
            runner: ubuntu-24.04
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        if: startsWith(matrix.rid, 'win-')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build Windows installer and portable ZIP
        if: startsWith(matrix.rid, 'win-')
        run: bash packaging/windows/build-installer.sh '${{ matrix.rid }}'
      - name: Build Linux archive
        if: startsWith(matrix.rid, 'linux-')
        run: bash packaging/publish.sh '${{ matrix.rid }}'
      - name: Build macOS application and DMG
        if: startsWith(matrix.rid, 'osx-')
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: bash packaging/macos/build-app.sh --arch "${TARGET_RID#osx-}"
      - name: Validate lightweight release payload
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_RID: ${{ matrix.rid }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          rid = os.environ['TARGET_RID']
          if rid.startswith('osx-'):
              root = Path('dist/RoboExp.app')
              resources = root / 'Contents/Resources'
              binaries = root / 'Contents/MacOS'
          else:
              root = Path(f"dist/RoboExp-{os.environ['VERSION']}-{rid}")
              resources = binaries = root
          forbidden = [p for p in root.rglob('*')
                       if p.suffix.lower() == '.pdb' or p.name.lower() == 'toolchains'
                       or p.name.lower().startswith('arm-none-eabi-')]
          if forbidden:
              raise SystemExit(f'Compiler or debug artifacts in release payload: {forbidden}')
          suffix = '.exe' if rid.startswith('win-') else ''
          required = [binaries / f'RoboExp.App{suffix}', resources / 'LICENSE',
                      resources / 'THIRD-PARTY-NOTICES', binaries / 'RoboExp.App.runtimeconfig.json']
          runtime = 'coreclr.dll' if rid.startswith('win-') else ('libcoreclr.dylib' if rid.startswith('osx-') else 'libcoreclr.so')
          required.append(binaries / runtime)
          for path in required:
              if not path.is_file():
                  raise SystemExit(f'Missing release payload file: {path}')
          with zipfile.ZipFile('assets/robot-resources.zip') as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir()]
              for entry in files:
                  path = resources / 'vendor/app' / entry.filename
                  if not path.is_file() or path.stat().st_size != entry.file_size:
                      raise SystemExit(f'Missing or incomplete bundled robot resource: {path}')
          print(f'Validated {rid} payload: self-contained runtime, licenses, {len(files)} robot resources; no GCC or PDBs')
          PY
      - name: Stage only distributable files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_RID: ${{ matrix.rid }}
        run: |
          mkdir release-assets
          case "$TARGET_RID" in
            win-*)
              cp "dist/RoboExp-$VERSION-$TARGET_RID.zip" release-assets/
              cp "dist/RoboExp-$VERSION-$TARGET_RID-setup.exe" release-assets/
              ;;
            linux-*) cp "dist/RoboExp-$VERSION-$TARGET_RID.tar.gz" release-assets/ ;;
            osx-*) cp "dist/RoboExp-$VERSION-${TARGET_RID#osx-}.dmg" release-assets/ ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all platform outputs and create checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 packaging/release.py checksums release-assets "$VERSION"
      - name: Create or resume draft and upload complete asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            if [[ "$draft" != true ]]; then
              echo '::error::Release already published; refusing to replace published binaries. Create a new version tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "RoboEXP-CE $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
